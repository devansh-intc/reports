<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Reports</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F6F8;margin:0;padding:40px 24px;color:#1A202C}
  h1{font-size:1.6rem;margin-bottom:6px}
  .sub{color:#718096;font-size:.9rem;margin-bottom:32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;max-width:900px}
  .card{background:#fff;border-radius:10px;padding:24px;border:1px solid #E2E8F0;text-decoration:none;color:inherit;display:block;transition:box-shadow .15s}
  .card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .card h2{font-size:1.05rem;margin:0 0 6px}
  .card p{font-size:.82rem;color:#718096;margin:0}
  .dot{width:8px;height:8px;border-radius:50%;background:#48BB78;display:inline-block;margin-right:6px}
</style>
</head>
<body>
<h1>Client Reports</h1>
<p class="sub">Ad performance &amp; sales analysis dashboards</p>
<div class="grid">
  <a href="lme/" class="card">
    <h2><span class="dot"></span>Lion's Mane Extract</h2>
    <p>Facebook + Google Ads · Shopify Sales<br>Mar 1–15, 2025 vs 2026</p>
  </a>
  <a href="logox/" class="card">
    <h2><span class="dot"></span>LogOX</h2>
    <p>Facebook + Google Shopping · Shopify Sales<br>Mar 2025 · Feb 2026 · Mar 2026</p>
  </a>
</div>
</body>
</html>
